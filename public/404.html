<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Page not found — Makebee</title>
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      :root { color-scheme: dark light; --bg: #0a1324; --text: #f8fafc; --muted: #aab6c7; --gold: #efce63; --border: #24344b; }
      @media (prefers-color-scheme: light) {
        :root { --bg: #ffffff; --text: #0b1220; --muted: #526174; --gold: #8b5e00; --border: #e3e8ef; }
      }
      html, body { height: 100%; margin: 0; }
      body { display: grid; place-items: center; padding: 24px; box-sizing: border-box; background: var(--bg); color: var(--text);
        font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; text-align: center; }
      h1 { margin: 20px 0 8px; font-size: 1.75rem; letter-spacing: -0.02em; }
      p { margin: 0 0 28px; color: var(--muted); line-height: 1.6; }
      a { display: inline-block; padding: 12px 22px; border: 1px solid var(--border); border-radius: 10px; color: var(--text);
        text-decoration: none; font-weight: 600; font-size: 14.5px; }
      a:hover { border-color: var(--gold); color: var(--gold); }
      a:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <img src="/favicon.svg" width="56" height="56" alt="" />
      <h1>This page doesn’t exist</h1>
      <p>The link may be old or mistyped.</p>
      <a href="/">Go to the Makebee homepage</a>
    </main>
  </body>
</html>
