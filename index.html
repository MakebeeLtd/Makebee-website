<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <!-- Theme is resolved before first paint so there is no flash of the wrong palette.
         Order: saved choice → explicit system light preference → dark (brand default). -->
    <script>
      (function () {
        document.documentElement.classList.add('js');
        var theme = 'dark';
        try {
          var saved = localStorage.getItem('makebee-theme');
          if (saved === 'light' || saved === 'dark') theme = saved;
          else if (window.matchMedia('(prefers-color-scheme: light)').matches) theme = 'light';
        } catch (e) {}
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>

    <title>Makebee — Software Product Studio | Products, AI &amp; Automation</title>
    <meta name="description" content="Makebee is a software product studio in Lagos, Nigeria. We design and build digital products, software systems, AI solutions and business automation." />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <link rel="canonical" href="%VITE_SITE_URL%/" />
    <meta name="theme-color" content="#0A1324" />
    <meta name="color-scheme" content="dark light" />

    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Makebee" />
    <meta property="og:title" content="Makebee — Software Product Studio" />
    <meta property="og:description" content="We design and build digital products, software systems, AI solutions and business automation. Based in Lagos, Nigeria." />
    <meta property="og:url" content="%VITE_SITE_URL%/" />
    <meta property="og:image" content="%VITE_SITE_URL%/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Makebee logo on a midnight navy background with the line: Products that make ideas real." />
    <meta property="og:locale" content="en_NG" />

    <!-- Twitter / X (no twitter:site — add it only when a real Makebee account exists) -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Makebee — Software Product Studio" />
    <meta name="twitter:description" content="We design and build digital products, software systems, AI solutions and business automation." />
    <meta name="twitter:image" content="%VITE_SITE_URL%/og-image.png" />
    <meta name="twitter:image:alt" content="Makebee logo on a midnight navy background with the line: Products that make ideas real." />

    <!-- Structured data: only facts stated on this page (name, email, city, description). -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "%VITE_SITE_URL%/#organization",
            "name": "Makebee",
            "url": "%VITE_SITE_URL%/",
            "logo": {
              "@type": "ImageObject",
              "url": "%VITE_SITE_URL%/apple-touch-icon.png",
              "width": 180,
              "height": 180
            },
            "description": "Software product studio building digital products, software systems, AI solutions and business automation.",
            "slogan": "To make ideas be.",
            "email": "makebee.tech@gmail.com",
            "address": { "@type": "PostalAddress", "addressLocality": "Lagos", "addressCountry": "NG" }
          },
          {
            "@type": "WebSite",
            "@id": "%VITE_SITE_URL%/#website",
            "name": "Makebee",
            "url": "%VITE_SITE_URL%/",
            "inLanguage": "en",
            "publisher": { "@id": "%VITE_SITE_URL%/#organization" }
          }
        ]

  </head>
